<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--bg-page);background-image:var(--grid-bg);padding:24px;font-family:var(--font-body)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin:0 0 8px}
.grp{margin-bottom:22px}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton, Badge, Tag, Card, ProgressBar, Avatar, Switch, Tetromino } = window.TETRISJULIANNDesignSystem_af17e8;
const Icon = (p) => <iconify-icon icon={p.i}></iconify-icon>;
function Demo(){
  const [on,setOn] = React.useState(true);
  return (<div>
    <div className="grp"><div className="lbl">Button — variants</div>
      <div className="row">
        <Button>Start</Button>
        <Button variant="secondary">Pause</Button>
        <Button variant="ghost">Ghost</Button>
        <Button variant="danger">Game Over</Button>
        <Button variant="success">Clear</Button>
        <Button variant="magic">Rotate</Button>
      </div>
      <div className="row">
        <Button size="sm">Small</Button>
        <Button size="md">Medium</Button>
        <Button size="lg">Large</Button>
        <Button disabled>Disabled</Button>
      </div>
    </div>
    <div className="grp"><div className="lbl">IconButton</div>
      <div className="row">
        <IconButton label="up" variant="accent"><Icon i="pixelarticons:arrow-up"/></IconButton>
        <IconButton label="menu"><Icon i="pixelarticons:menu"/></IconButton>
        <IconButton label="play" size="lg" variant="accent"><Icon i="pixelarticons:play"/></IconButton>
        <IconButton label="close" variant="ghost"><Icon i="pixelarticons:close"/></IconButton>
      </div>
    </div>
    <div className="grp"><div className="lbl">Badge &amp; Tag</div>
      <div className="row">
        <Badge piece="s" dot>Online</Badge>
        <Badge piece="o" variant="soft">New</Badge>
        <Badge piece="z" variant="outline">Hot</Badge>
        <Badge piece="t">Level 9</Badge>
      </div>
      <div className="row">
        <Tag piece="i">React</Tag>
        <Tag piece="l" interactive>Python</Tag>
        <Tag piece="t" active>Algorithms</Tag>
        <Tag piece="s">Rust</Tag>
      </div>
    </div>
    <div className="grp"><div className="lbl">Card · ProgressBar · Avatar · Switch · Tetromino</div>
      <div className="row" style={{alignItems:'stretch'}}>
        <Card accent="t" accentBar interactive style={{maxWidth:200}}>
          <div style={{fontFamily:'var(--font-pixel)',fontSize:12,color:'var(--text-strong)',textTransform:'uppercase'}}>Pathfinder</div>
          <p style={{margin:'8px 0 0',fontSize:13,color:'var(--text-muted)'}}>A* maze visualizer in the browser.</p>
        </Card>
        <div style={{minWidth:200}}>
          <ProgressBar value={70} piece="s" label="C++" />
          <div style={{height:10}}/>
          <ProgressBar value={40} piece="o" label="Go" />
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10,alignItems:'flex-start'}}>
          <div className="row" style={{margin:0}}>
            <Avatar initials="JU" piece="t"/>
            <Avatar initials="JU" piece="i" round/>
          </div>
          <Switch checked={on} onChange={setOn} label={on?'SFX on':'SFX off'} />
          <Tetromino piece="s" size={18} bob/>
        </div>
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
