<!-- @dsCard group="Brand" viewport="700x170" name="Motion — Drop & Clear" subtitle="Pieces drop in; lines flash white on clear" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-page);padding:24px;font-family:var(--font-mono);overflow:hidden">
<div style="display:flex;gap:40px;align-items:center">
  <div style="text-align:center">
    <div style="height:80px;display:flex;align-items:flex-end;justify-content:center">
      <div id="drop" style="width:56px;height:56px;background:var(--piece-i);box-shadow:var(--bevel-block);animation:ds-drop 1.4s var(--ease-snap) infinite"></div>
    </div>
    <div style="margin-top:10px;color:var(--text-muted);font-size:10px">ds-drop · --ease-snap</div>
  </div>
  <div style="text-align:center">
    <div style="display:flex;gap:4px;justify-content:center">
      <div class="ln" style="width:32px;height:32px;background:var(--piece-z)"></div>
      <div class="ln" style="width:32px;height:32px;background:var(--piece-l)"></div>
      <div class="ln" style="width:32px;height:32px;background:var(--piece-o)"></div>
      <div class="ln" style="width:32px;height:32px;background:var(--piece-s)"></div>
    </div>
    <div style="margin-top:10px;color:var(--text-muted);font-size:10px">ds-line-clear flash</div>
  </div>
  <div style="text-align:center">
    <div style="font-family:var(--font-pixel);color:var(--piece-o);font-size:18px;animation:ds-blink 1s steps(1) infinite">PRESS START</div>
    <div style="margin-top:10px;color:var(--text-muted);font-size:10px">ds-blink</div>
  </div>
</div>
<script>
const lns=[...document.querySelectorAll('.ln')];
function flash(){lns.forEach((l,i)=>setTimeout(()=>{l.style.animation='ds-line-clear 0.5s ease-out';setTimeout(()=>l.style.animation='',500);},i*80));}
setInterval(flash,1800);flash();
</script>
</body></html>
