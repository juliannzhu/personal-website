<!-- @dsCard group="Brand" viewport="700x170" name="Surfaces & Backgrounds" subtitle="Playfield grid, the well, and CRT scanlines" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-page);padding:20px;font-family:var(--font-mono)">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
  <div><div style="height:90px;background:var(--bg-page);background-image:var(--grid-bg);border:1px solid var(--border-hairline)"></div><div style="margin-top:8px;color:var(--text-muted);font-size:10px">--grid-bg playfield</div></div>
  <div><div style="height:90px;background:var(--bg-well);background-image:var(--grid-bg);border:2px solid var(--border-strong)"></div><div style="margin-top:8px;color:var(--text-muted);font-size:10px">.ds-well</div></div>
  <div><div style="position:relative;height:90px;background:var(--surface-card);overflow:hidden" class="ds-scanlines"></div><div style="margin-top:8px;color:var(--text-muted);font-size:10px">.ds-scanlines CRT</div></div>
</div>
</body></html>
