<!-- @dsCard group="Colors" viewport="700x150" name="Neutral Screen Scale" subtitle="Arcade-screen darks: well → page → surfaces → borders" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-page);padding:20px;font-family:var(--font-mono)">
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px" id="row"></div>
<script>
const tokens=[['--ink-1000','well'],['--ink-900','page'],['--ink-800','raised'],['--ink-700','card'],['--ink-600','elev'],['--ink-500','line'],['--ink-400','border'],['--ink-300','disabled']];
document.getElementById('row').innerHTML=tokens.map(([t,l])=>{
  const v=getComputedStyle(document.documentElement).getPropertyValue(t).trim();
  return `<div><div style="height:64px;background:var(${t});border:1px solid var(--border-hairline)"></div>
  <div style="margin-top:6px;color:var(--text-body);font-size:11px;font-weight:600">${l}</div>
  <div style="color:var(--text-faint);font-size:9px">${v}</div></div>`;
}).join('');
</script>
</body></html>
