<!-- @dsCard group="Colors" viewport="700x150" name="Semantic & Text" subtitle="Accent, status colors, and the text ramp" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-page);background-image:var(--grid-bg);padding:20px;font-family:var(--font-mono)">
<div style="display:flex;gap:18px;flex-wrap:wrap">
  <div style="display:grid;grid-template-columns:repeat(6,40px);gap:8px" id="sem"></div>
  <div style="width:1px;background:var(--border-hairline)"></div>
  <div id="text" style="display:flex;flex-direction:column;gap:6px"></div>
</div>
<script>
const sem=[['--accent','accent'],['--success','ok'],['--warning','warn'],['--danger','err'],['--info','info'],['--magic','magic']];
document.getElementById('sem').innerHTML=sem.map(([t,l])=>`<div><div style="height:40px;background:var(${t});box-shadow:var(--bevel-block)"></div><div style="margin-top:6px;color:var(--text-muted);font-size:9px;text-align:center">${l}</div></div>`).join('');
const txt=[['--text-strong','strong'],['--text-body','body'],['--text-muted','muted'],['--text-faint','faint']];
document.getElementById('text').innerHTML=txt.map(([t,l])=>`<div style="color:var(${t});font-size:14px;font-weight:600">${l} — Aa Bb 0123</div>`).join('');
</script>
</body></html>
