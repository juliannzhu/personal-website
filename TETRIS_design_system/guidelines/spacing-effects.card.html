<!-- @dsCard group="Spacing" viewport="700x160" name="Bevels & Shadows" subtitle="The 3D block face and hard-offset drop shadow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-page);padding:24px;font-family:var(--font-mono)">
<div style="display:flex;gap:28px;align-items:center">
  <div style="text-align:center"><div style="width:72px;height:72px;background:var(--piece-t);box-shadow:var(--bevel-block)"></div><div style="margin-top:10px;color:var(--text-muted);font-size:10px">--bevel-block</div></div>
  <div style="text-align:center"><div style="width:72px;height:72px;background:var(--surface-card);box-shadow:var(--shadow-block)"></div><div style="margin-top:10px;color:var(--text-muted);font-size:10px">--shadow-block</div></div>
  <div style="text-align:center"><div style="width:72px;height:72px;background:var(--surface-card);box-shadow:var(--shadow-soft)"></div><div style="margin-top:10px;color:var(--text-muted);font-size:10px">--shadow-soft</div></div>
  <div style="text-align:center"><div style="width:72px;height:72px;background:var(--piece-i);box-shadow:var(--glow-cyan)"></div><div style="margin-top:10px;color:var(--text-muted);font-size:10px">--glow-cyan</div></div>
</div>
</body></html>
