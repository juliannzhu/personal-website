<!-- @dsCard group="Website" viewport="1080x560" name="Hero — 3 directions" subtitle="Explore: Drop Zone · The Well · Insert Coin" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero variations</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;background:var(--ink-1000);}
  .lblbar{font-family:var(--font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);
    padding:14px 24px;border-top:2px solid var(--border-strong);display:flex;gap:12px;align-items:center;background:var(--ink-900);}
  .lblbar b{color:var(--piece-i);}
  .frame{position:relative;background:var(--bg-page);background-image:var(--grid-bg);overflow:hidden;}
  .frame::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--scanlines);background-size:100% 4px;opacity:.45;mix-blend-mode:multiply;}
  @keyframes vfall{0%{transform:translateY(-120px) rotate(0)}100%{transform:translateY(620px) rotate(var(--r,90deg))}}
  .vpiece{position:absolute;top:0;opacity:.16;animation:vfall linear infinite;}
  @keyframes vblink{0%,55%{opacity:1}56%,100%{opacity:.2}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const NS = window.TETRISJULIANNDesignSystem_af17e8;
const { Button, Badge, Tetromino } = NS;
const PIECES = ['i','o','t','s','z','j','l'];
const COLORS = ['--piece-i','--piece-o','--piece-t','--piece-s','--piece-z','--piece-j','--piece-l'];

function Name({ size }) {
  return (
    <h1 style={{ fontFamily:'var(--font-pixel)', fontSize:size, lineHeight:1.1, margin:0, textTransform:'uppercase', letterSpacing:'0.02em' }}>
      {'JULIANN'.split('').map((c,i)=>(
        <span key={i} style={{ color:`var(${COLORS[i%7]})`, textShadow:'0 4px 0 rgba(0,0,0,0.4)' }}>{c}</span>
      ))}
    </h1>
  );
}

/* A — DROP ZONE */
function HeroA() {
  const drops = Array.from({length:12}).map((_,i)=>({p:PIECES[i%7],left:(i*8.4+3)%95,size:16+(i%4)*6,dur:7+(i%5)*2,delay:-(i*1.6),r:i%2?90:-90}));
  return (
    <div className="frame" style={{ height:540 }}>
      {drops.map((d,i)=>(<img key={i} src={`../../assets/pieces/${d.p}.svg`} className="vpiece" style={{left:`${d.left}%`,height:d.size,'--r':`${d.r}deg`,animationDuration:`${d.dur}s`,animationDelay:`${d.delay}s`}} />))}
      <div style={{ position:'relative', maxWidth:1080, margin:'0 auto', padding:'80px 24px', textAlign:'center' }}>
        <div style={{display:'flex',justifyContent:'center',marginBottom:24}}><Badge piece="s" dot>Now playing · CS @ University</Badge></div>
        <Name size="clamp(34px,6vw,60px)" />
        <p style={{ maxWidth:540, margin:'24px auto 0', fontSize:18, color:'var(--text-body)', lineHeight:1.6 }}>Computer science major, puzzle-solver, and serial block-stacker. I build clean, playful software — and I clear my lines.</p>
        <div style={{display:'flex',gap:14,justifyContent:'center',marginTop:32}}>
          <Button variant="primary" size="lg">View Work</Button>
          <Button variant="ghost" size="lg">Get In Touch</Button>
        </div>
      </div>
    </div>
  );
}

/* B — THE WELL (two-column, game-screen) */
function MiniBoard() {
  // 8 cols x 14 rows; stack bottom rows
  const cols=8, rows=14;
  const stack = {}; // key "c,r" -> piece
  const fill = [
    // row 13 (bottom) almost full
    [13,'s'],[13,'z'],[13,'i'],[13,'o'],[13,'t'],[13,'l'],[13,'j'],
    [12,'z'],[12,'i'],[12,'o'],[12,'t'],[12,'l'],
    [11,'i'],[11,'o'],[11,'t'],
    [10,'o'],[10,'t'],
  ];
  // assign columns left-to-right per row
  const rowCols = {};
  fill.forEach(([r,p])=>{ rowCols[r]=(rowCols[r]||0); stack[`${rowCols[r]},${r}`]=p; rowCols[r]++; });
  const cells=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const p=stack[`${c},${r}`];
    cells.push(<div key={`${c},${r}`} style={{width:26,height:26,background:p?`var(--piece-${p})`:'transparent',
      boxShadow:p?'inset 2px 2px 0 rgba(255,255,255,.35), inset -2px -2px 0 rgba(0,0,0,.35)':'inset 0 0 0 1px rgba(255,255,255,.04)'}} />);
  }
  return (
    <div style={{ display:'inline-flex', flexDirection:'column', gap:14, alignItems:'center' }}>
      <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
        <div style={{ display:'grid', gridTemplateColumns:`repeat(${cols},26px)`, gap:2, padding:6, background:'var(--bg-well)', border:'3px solid var(--border-strong)' }}>{cells}</div>
        <div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'.14em',color:'var(--text-faint)',textTransform:'uppercase',marginBottom:8}}>Next</div>
          <Tetromino piece="t" size={14} bob />
          <div style={{fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'.14em',color:'var(--text-faint)',textTransform:'uppercase',margin:'20px 0 8px'}}>Score</div>
          <div style={{fontFamily:'var(--font-pixel)',fontSize:14,color:'var(--piece-o)'}}>04200</div>
        </div>
      </div>
    </div>
  );
}
function HeroB() {
  return (
    <div className="frame" style={{ height:540 }}>
      <div style={{ position:'relative', maxWidth:1080, margin:'0 auto', padding:'64px 24px', display:'grid', gridTemplateColumns:'1.1fr auto', gap:48, alignItems:'center' }}>
        <div>
          <div style={{marginBottom:20}}><Badge piece="i" dot>cs major · open to internships</Badge></div>
          <Name size="clamp(30px,5vw,52px)" />
          <p style={{ maxWidth:440, margin:'22px 0 0', fontSize:17, color:'var(--text-body)', lineHeight:1.6 }}>I rotate hard problems until they fit. Currently stacking lines, commits, and a CS degree.</p>
          <div style={{display:'flex',gap:14,marginTop:30}}>
            <Button variant="primary" size="lg">View Work</Button>
            <Button variant="secondary" size="lg">Resume</Button>
          </div>
        </div>
        <MiniBoard />
      </div>
    </div>
  );
}

/* C — INSERT COIN (minimal arcade marquee) */
function HeroC() {
  return (
    <div className="frame" style={{ height:540, display:'flex', alignItems:'center', justifyContent:'center', background:'var(--ink-1000)', backgroundImage:'var(--grid-bg)' }}>
      <div style={{ textAlign:'center', position:'relative' }}>
        <div style={{display:'flex',justifyContent:'center',marginBottom:28}}><Tetromino piece="t" size={20} bob /></div>
        <Name size="clamp(40px,7vw,72px)" />
        <div style={{ fontFamily:'var(--font-mono)', fontSize:13, letterSpacing:'0.3em', color:'var(--text-muted)', textTransform:'uppercase', marginTop:24 }}>Computer Science · Portfolio</div>
        <div style={{ marginTop:40, fontFamily:'var(--font-pixel)', fontSize:16, color:'var(--piece-o)', animation:'vblink 1.1s steps(1) infinite', textTransform:'uppercase' }}>▶ Press Start</div>
      </div>
    </div>
  );
}

function Lbl({ tag, name, desc }) {
  return <div className="lblbar"><b>{tag}</b> <span style={{color:'var(--text-strong)',fontWeight:700}}>{name}</span> <span>— {desc}</span></div>;
}
function Canvas() {
  return (<div>
    <Lbl tag="A" name="Drop Zone" desc="falling pieces, color-per-letter, HUD stats" />
    <HeroA />
    <Lbl tag="B" name="The Well" desc="two-column game-screen with a live board + next/score" />
    <HeroB />
    <Lbl tag="C" name="Insert Coin" desc="minimal arcade marquee, blinking press-start" />
    <HeroC />
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Canvas/>);
</script>
</body>
</html>
