<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a12" />

    <title>Juliann Zhu · Software Developer & CS Student @ UWaterloo</title>
    <meta name="description" content="Software developer and computer science student at UWaterloo. Explore Juliann Zhu's projects, research, and side quests in a playable Tetris portfolio." />
    <meta name="author" content="Juliann Zhu" />

    <!-- Absolute URLs below use the deployed domain; update all four (canonical, og:url, og:image, twitter:image) if it ever changes. -->
    <link rel="canonical" href="https://juliannzhu.vercel.app/" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Juliann Zhu" />
    <meta property="og:title" content="Juliann Zhu · CS @ UWaterloo" />
    <meta property="og:description" content="A playable Tetris portfolio of my projects, research, and side quests. Software developer and CS student at UWaterloo." />
    <meta property="og:url" content="https://juliannzhu.vercel.app/" />
    <meta property="og:image" content="https://juliannzhu.vercel.app/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Juliann Zhu — a playable Tetris portfolio" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Juliann Zhu · CS @ UWaterloo" />
    <meta name="twitter:description" content="A playable Tetris portfolio of my projects, research, and side quests. Software developer and CS student at UWaterloo." />
    <meta name="twitter:image" content="https://juliannzhu.vercel.app/assets/og-image.png" />

    <!-- Structured data. Tells search engines who the site is about and that these profiles are
         all the same person, which is what separates this Juliann Zhu from any other. Kept here
         as static markup rather than injected by React, so crawlers that don't run JavaScript
         still read it. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Juliann Zhu",
      "url": "https://juliannzhu.vercel.app/",
      "jobTitle": "Software Developer",
      "description": "Software developer and computer science student at the University of Waterloo.",
      "affiliation": {
        "@type": "CollegeOrUniversity",
        "name": "University of Waterloo"
      },
      "sameAs": [
        "https://github.com/juliannzhu",
        "https://linkedin.com/in/juliann-zhu/",
        "https://devpost.com/juliannzhu",
        "https://instagram.com/juliann.zhu"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
